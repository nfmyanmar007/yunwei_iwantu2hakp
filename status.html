<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Status</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #493d40;
      background: #fbf6f2;
    }
    .card {
      width: min(100%, 470px);
      padding: 28px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 22px 60px rgba(94,61,68,.12);
    }
    h1 { margin-top: 0; font-family: Georgia, serif; font-weight: 500; }
    label { display:block; margin: 16px 0 7px; font-size:.84rem; font-weight:700; }
    input {
      width:100%; min-height:46px; border:1px solid #e5d6d9; border-radius:12px;
      padding:10px 12px; font:inherit;
    }
    button {
      width:100%; min-height:48px; margin-top:16px; border:0; border-radius:999px;
      background:#9c4f5e; color:#fff; font-weight:700; cursor:pointer;
    }
    .result {
      margin-top:20px; padding:17px; border-radius:16px; background:#fbf5f6;
      line-height:1.65; display:none;
    }
    .yes { font-weight:700; color:#7c3d49; }
    .muted { color:#8b777b; font-size:.82rem; line-height:1.5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Message status</h1>
    <p class="muted">This private page checks only the anonymous open/reveal events stored for your link ID.</p>

    <label for="linkId">Link ID</label>
    <input id="linkId" value="apology-01" />

    <label for="secret">Status secret</label>
    <input id="secret" type="password" autocomplete="current-password" />

    <button id="checkBtn">Check status</button>

    <div id="result" class="result"></div>
  </main>

  <script>
    const btn = document.getElementById("checkBtn");
    const result = document.getElementById("result");

    btn.addEventListener("click", async () => {
      result.style.display = "block";
      result.textContent = "Checking...";

      try {
        const linkId = encodeURIComponent(document.getElementById("linkId").value.trim());
        const secret = document.getElementById("secret").value;

        const response = await fetch(`/api/status?linkId=${linkId}`, {
          headers: { "x-status-secret": secret }
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          result.textContent = data.error || "Could not check status.";
          return;
        }

        const opened = data.opened ? "Yes" : "Not yet";
        const revealed = data.messageRevealed ? "Yes" : "Not yet";
        const openedTime = data.lastOpenedAt ? new Date(data.lastOpenedAt).toLocaleString() : "—";
        const revealedTime = data.lastRevealedAt ? new Date(data.lastRevealedAt).toLocaleString() : "—";

        result.innerHTML = `
          <div><span class="yes">Link opened:</span> ${opened}</div>
          <div><span class="yes">Message revealed:</span> ${revealed}</div>
          <div><span class="yes">Last opened:</span> ${openedTime}</div>
          <div><span class="yes">Last revealed:</span> ${revealedTime}</div>
        `;
      } catch (_) {
        result.textContent = "Could not check status.";
      }
    });
  </script>
</body>
</html>
