<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Link Status</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;color:#eee;background:#100d20}.card{width:min(100%,560px);padding:28px;border-radius:24px;background:#201a34;box-shadow:0 22px 60px rgba(0,0,0,.3)}h1{margin-top:0;font-family:Georgia,serif;font-weight:500}.muted{color:#bfb4c8;font-size:.82rem;line-height:1.5}label{display:block;margin:16px 0 7px;font-size:.84rem;font-weight:700}input{width:100%;min-height:46px;border:1px solid #463c5c;border-radius:12px;padding:10px 12px;font:inherit;color:#fff;background:#151125}button{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:999px;background:linear-gradient(135deg,#ffd990,#ff96b9);color:#241628;font-weight:800;cursor:pointer}.result{margin-top:20px;padding:17px;border-radius:16px;background:#171229;line-height:1.7;display:none}.key{font-weight:800;color:#ffd990}.warn{margin-top:12px;color:#ffcf8c;font-size:.82rem;line-height:1.5}.divider{height:1px;background:#32284a;margin:14px 0}.small{font-size:.82rem;color:#cfc5da}.coords{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
</head>
<body>
  <main class="card">
    <h1>Birthday link status 🎂</h1>
    <p class="muted">Private analytics for your October 28 link. All location shown here is inferred from the visitor's public IP and browser settings. It is not GPS and can still be wrong.</p>
    <label for="linkId">Link ID</label>
    <input id="linkId" value="oct28-birthday-01" />
    <label for="secret">Status secret</label>
    <input id="secret" type="password" autocomplete="current-password" />
    <button id="checkBtn">Check status</button>
    <div id="result" class="result"></div>
  </main>
  <script>
    const btn=document.getElementById('checkBtn');const result=document.getElementById('result');
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    btn.addEventListener('click',async()=>{result.style.display='block';result.textContent='Checking...';try{const linkId=encodeURIComponent(document.getElementById('linkId').value.trim());const secret=document.getElementById('secret').value;const response=await fetch(`/api/status?linkId=${linkId}`,{headers:{'x-status-secret':secret}});const data=await response.json();if(!response.ok||!data.ok){result.textContent=data.error||'Could not check status.';return}const reactionLabels={yes_smile:'Yes ❤️',of_course:'Of course 😄'};const location=[data.city,data.region,data.country].filter(Boolean).join(', ')||'Not available';const coords=(data.latitude!==null&&data.longitude!==null)?`${data.latitude}, ${data.longitude}`:'Not available';result.innerHTML=`
      <div><span class="key">Link opened:</span> ${data.opened?'Yes':'Not yet'}</div>
      <div><span class="key">Open count:</span> ${data.openCount}</div>
      <div><span class="key">Birthday wish opened:</span> ${data.messageRevealed?'Yes':'Not yet'}</div>
      <div><span class="key">Last opened:</span> ${data.lastOpenedAt?esc(new Date(data.lastOpenedAt).toLocaleString()):'—'}</div>
      <div class="divider"></div>
      <div><span class="key">Approx. city/region:</span> ${esc(location)}</div>
      <div><span class="key">Postal estimate:</span> ${esc(data.postalCode||'Not available')}</div>
      <div><span class="key">IP coordinates:</span> <span class="coords">${esc(coords)}</span></div>
      <div><span class="key">IP timezone:</span> ${esc(data.ipTimezone||'Not available')}</div>
      <div><span class="key">Browser timezone:</span> ${esc(data.browserTimezone||'Not available')}</div>
      <div><span class="key">Browser language:</span> ${esc(data.browserLanguage||'Not available')}</div>
      <div class="small">The coordinates above are the IP geolocation area's coordinates, not the visitor's exact device/GPS position.</div>
      <div class="divider"></div>
      <div><span class="key">Her answer:</span> ${data.responseReceived?esc(reactionLabels[data.latestReaction]||data.latestReaction):'No answer sent'}</div>
      <div><span class="key">Answer time:</span> ${data.latestReactionAt?esc(new Date(data.latestReactionAt).toLocaleString()):'—'}</div>
      ${data.locationMode==='full'?'':data.locationMode==='basic'?'<div class="warn">Basic location works, but the new detail columns are missing. Run the latest SQL in README.md, then redeploy/open the link again.</div>':'<div class="warn">Location columns are not enabled in Supabase. Run the SQL in README.md.</div>'}`;}catch(_){result.textContent='Could not check status.'}});
  </script>
</body>
</html>
